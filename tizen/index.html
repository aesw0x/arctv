<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ArcTV</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="stage">

    <div id="app">

        <section id="screen-pairing" class="screen"></section>

        <section id="screen-library" class="screen hidden"></section>

        <section id="screen-detail" class="screen hidden"></section>

    </div>

    <div id="player-layer" class="hidden">
        <object id="av-player" type="application/avplayer"></object>
        <video id="html-player" class="hidden" playsinline></video>

        <div id="player-ui">
            <div id="player-top">
                <span id="player-title"></span>
            </div>
            <div id="player-bottom">
                <div id="player-bar">
                    <div id="player-buffer"></div>
                    <div id="player-fill">
                        <div id="player-thumb"></div>
                    </div>
                </div>
                <div id="player-times">
                    <span id="player-pos">0:00</span>
                    <span id="player-hint"></span>
                    <span id="player-dur">0:00</span>
                </div>
                <div id="player-controls"></div>
            </div>

            <div id="player-sheet" class="player-sheet hidden">
                <div class="player-sheet-heading">
                    <div id="player-sheet-title" class="player-sheet-title"></div>
                    <div class="player-sheet-note">Use the remote to choose · Back closes</div>
                </div>
                <div id="player-sheet-options"></div>
            </div>
        </div>
    </div>

</div>

<script src="js/fit.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/focus.js"></script>
<script src="js/pairing.js"></script>
<script src="js/library.js"></script>
<script src="js/detail.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
<script src="js/perf.js"></script>

</body>
</html>
